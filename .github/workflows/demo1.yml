name: metrix-demo
 
on:
- push
- workflow_dispatch
 
jobs:
  ## A Template Job
  job-template:
    strategy:
      matrix:
        java-version: [ 11, 17, 21 ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        cache: maven
    - run: mvn -B clean package
